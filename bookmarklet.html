<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bkmk-chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--sf:#161b24;--bd:#252d3a;--mu:#3a4455;--tx:#cdd6e8;--dm:#5c6b80;--ac:#4f8ef7;--ad:rgba(79,142,247,.12);--ob:rgba(79,142,247,.07);--er:#f7635a;--ok:#3ddc84;--fb:'Inter',system-ui,sans-serif;--fm:'JetBrains Mono','Courier New',monospace;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:14px;line-height:1.55}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;position:relative}
#sb{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sf);border-right:1px solid var(--bd);overflow:hidden}
#sbh{padding:12px 14px 10px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
#sb-title{font-family:var(--fm);font-size:13px;font-weight:600;color:var(--ac)}
#id-badge{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--ac);background:var(--ad);border:1px solid rgba(79,142,247,.3);padding:2px 8px;border-radius:3px;width:fit-content}
#chat-list{flex:1;overflow-y:auto;padding:6px 0}
#chat-list::-webkit-scrollbar{width:4px}
#chat-list::-webkit-scrollbar-thumb{background:var(--mu);border-radius:2px}
.cl-label{font-family:var(--fm);font-size:10px;font-weight:600;color:var(--dm);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 3px}
.ci{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 12px;transition:background .12s;font-size:13px;color:var(--dm);border-left:2px solid transparent;position:relative}
.ci:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.ci.active{background:var(--ad);color:var(--ac);border-left-color:var(--ac);font-weight:500}
.ci-icon{font-size:12px;flex-shrink:0;opacity:.7;cursor:pointer}
.ci.active .ci-icon{opacity:1}
.ci-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ci-del{background:none;border:none;color:var(--er);cursor:pointer;font-size:15px;padding:1px 5px;line-height:1;flex-shrink:0;opacity:0;transition:opacity .15s;border-radius:3px}
.ci:hover .ci-del,.ci.del-confirm .ci-del{opacity:.5}
.ci-del:hover{opacity:1!important;background:rgba(247,99,90,.15)}
.ci.del-confirm{background:rgba(247,99,90,.07)!important;border-left-color:var(--er)!important}
.ci.del-confirm .ci-del{display:none}
.ci-confirm{display:none;gap:4px;flex-shrink:0}
.ci.del-confirm .ci-confirm{display:flex}
.ci-yes{background:var(--er);border:none;color:#fff;font-size:10px;font-family:var(--fm);padding:2px 7px;border-radius:3px;cursor:pointer;white-space:nowrap}
.ci-no{background:none;border:1px solid var(--bd);color:var(--dm);font-size:10px;font-family:var(--fm);padding:2px 7px;border-radius:3px;cursor:pointer}
#sbf{padding:10px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sbbtn{background:none;border:1px solid var(--bd);color:var(--dm);padding:7px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-family:var(--fm);text-align:left;transition:border-color .2s,color .2s,background .2s;width:100%}
.sbbtn:hover{border-color:var(--ac);color:var(--ac);background:var(--ad)}
.sbbtn.pri{background:rgba(79,142,247,.13);border-color:rgba(79,142,247,.35);color:var(--ac)}
.sbbtn.pri:hover{background:var(--ac);border-color:var(--ac);color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#chdr{display:flex;align-items:center;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;gap:8px}
#back-btn{display:none;background:none;border:1px solid var(--bd);color:var(--dm);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
#chat-name-disp{font-family:var(--fm);font-size:13px;font-weight:600;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#sdot{width:7px;height:7px;border-radius:50%;background:var(--mu);flex-shrink:0;transition:background .3s}
#sdot.live{background:var(--ok);box-shadow:0 0 5px var(--ok)}
#sdot.err{background:var(--er)}
#stxt{font-size:11px;color:var(--dm);font-family:var(--fm)}
.ibtn{background:none;border:1px solid var(--bd);color:var(--dm);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:11px;font-family:var(--fm);transition:border-color .2s,color .2s,background .2s;white-space:nowrap}
.ibtn:hover{border-color:var(--ac);color:var(--ac);background:var(--ad)}
#cfg{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:none;flex-direction:column;gap:8px;flex-shrink:0}
#cfg.open{display:flex}
#cfg label{font-size:11px;color:var(--dm);font-family:var(--fm);display:block;margin-bottom:2px}
#cfg input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:7px 10px;border-radius:4px;font-family:var(--fm);font-size:12px;outline:none;transition:border-color .2s}
#cfg input:focus{border-color:var(--ac)}
#cfg-save{align-self:flex-end;background:var(--ac);color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-family:var(--fm);font-size:12px;font-weight:600}
#cfg-hint{font-size:11px;color:var(--dm);line-height:1.5}
#cfg-hint a{color:var(--ac)}
#ntb{background:rgba(247,99,90,.08);border-bottom:1px solid rgba(247,99,90,.25);color:#f7a09a;font-size:11px;font-family:var(--fm);padding:8px 16px;display:none;align-items:center;gap:8px;flex-shrink:0}
#ntb.on{display:flex}
#ntb button{background:none;border:1px solid rgba(247,99,90,.4);color:#f7a09a;padding:2px 10px;border-radius:3px;cursor:pointer;font-family:var(--fm);font-size:11px;margin-left:auto}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:1px}
#msgs::-webkit-scrollbar{width:5px}
#msgs::-webkit-scrollbar-thumb{background:var(--mu);border-radius:3px}
.msg{padding:4px 10px;border-radius:4px;border-left:2px solid transparent;word-break:break-word}
.msg:hover{background:rgba(255,255,255,.02)}
.msg.own{background:var(--ob);border-left-color:var(--ac)}
.mid{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--dm);margin-right:5px}
.msg.own .mid{color:var(--ac)}
.mbody{color:var(--tx);font-size:13.5px;line-height:1.5}
.mrow{display:flex;align-items:baseline;flex-wrap:wrap}
.mtime{font-family:var(--fm);font-size:10px;color:var(--dm);margin-left:auto;padding-left:10px;flex-shrink:0;opacity:0;transition:opacity .15s}
.msg:hover .mtime{opacity:1}
.msys{text-align:center;color:var(--dm);font-size:11px;font-family:var(--fm);padding:8px 0;opacity:.6}
.mimg-lnk{display:inline-block;color:var(--ac);font-family:var(--fm);font-size:12px;text-decoration:underline;text-decoration-color:rgba(79,142,247,.4);cursor:pointer;word-break:break-all}
.mimg-lnk:hover{text-decoration-color:var(--ac)}
.mimg-prev{display:block;margin-top:5px;max-width:min(320px,90%);max-height:240px;object-fit:contain;border-radius:5px;border:1px solid var(--bd);cursor:pointer;background:var(--bg)}
.mimg-prev.h{display:none}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dm);font-size:12px;font-family:var(--fm);gap:6px;text-align:center}
#empty .big{font-size:26px;opacity:.25}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:6px;pointer-events:none}
#lb-x{position:absolute;top:16px;right:20px;color:rgba(255,255,255,.6);font-size:26px;cursor:pointer;background:none;border:none;line-height:1}
#lb-x:hover{color:#fff}
#istrip{display:none;padding:8px 16px 0;background:var(--sf);border-top:1px solid var(--bd);gap:8px;flex-wrap:wrap;flex-shrink:0}
#istrip.on{display:flex}
.ithw{position:relative;width:52px;height:52px}
.ith{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--bd)}
.ithrm{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--er);color:#fff;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
#input-area{display:flex;align-items:flex-end;gap:8px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd);flex-shrink:0}
#msgin{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:9px 12px;border-radius:5px;font-family:var(--fb);font-size:13.5px;line-height:1.5;resize:none;min-height:40px;max-height:120px;outline:none;transition:border-color .2s;overflow-y:auto}
#msgin:focus{border-color:var(--ac)}
#msgin::placeholder{color:var(--dm)}
#imgbtn{background:none;border:1px solid var(--bd);color:var(--dm);padding:0 10px;border-radius:5px;cursor:pointer;height:40px;font-size:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,background .2s}
#imgbtn:hover{border-color:var(--ac);color:var(--ac);background:var(--ad)}
#imgin{display:none}
#sendbtn{background:var(--ac);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-family:var(--fm);font-size:12px;font-weight:600;height:40px;flex-shrink:0;transition:opacity .2s,transform .1s}
#sendbtn:hover{opacity:.85}
#sendbtn:active{transform:scale(.97)}
#sendbtn:disabled{opacity:.4;cursor:not-allowed}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--sf);border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:5px;font-size:12px;font-family:var(--fm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--er);color:var(--er)}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;align-items:center;justify-content:center;padding:20px}
#mo.open{display:flex}
#modal{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.mtitle{font-family:var(--fm);font-size:13px;font-weight:600;color:var(--tx)}
.mtoggle{display:flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.tybtn{flex:1;background:none;border:none;color:var(--dm);padding:7px;font-family:var(--fm);font-size:12px;cursor:pointer;transition:background .15s,color .15s}
.tybtn.on{background:var(--ac);color:#fff}
.mf{display:flex;flex-direction:column;gap:4px}
.mlabel{font-size:11px;color:var(--dm);font-family:var(--fm)}
.min{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:8px 10px;border-radius:4px;font-family:var(--fm);font-size:13px;outline:none;transition:border-color .2s;width:100%}
.min:focus{border-color:var(--ac)}
.min::placeholder{color:var(--dm)}
.mrow2{display:flex;gap:6px}
.mrow2 .min{flex:1}
#add-mbr{background:none;border:1px solid var(--bd);color:var(--dm);padding:8px 12px;border-radius:4px;cursor:pointer;font-family:var(--fm);font-size:12px;white-space:nowrap;transition:border-color .2s,color .2s;flex-shrink:0}
#add-mbr:hover{border-color:var(--ac);color:var(--ac)}
#chips{display:flex;flex-wrap:wrap;gap:5px;min-height:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--ad);border:1px solid rgba(79,142,247,.3);color:var(--ac);padding:2px 7px;border-radius:3px;font-family:var(--fm);font-size:11px;font-weight:600}
.chiprm{background:none;border:none;color:var(--ac);cursor:pointer;font-size:14px;padding:0;line-height:1;opacity:.6}
.chiprm:hover{opacity:1}
.mhint{font-size:11px;color:var(--dm);line-height:1.55}
.mactions{display:flex;gap:8px;justify-content:flex-end;padding-top:2px}
.mcancel{background:none;border:1px solid var(--bd);color:var(--dm);padding:7px 14px;border-radius:4px;cursor:pointer;font-family:var(--fm);font-size:12px}
.mcancel:hover{border-color:var(--tx);color:var(--tx)}
.mcreate{background:var(--ac);border:none;color:#fff;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:var(--fm);font-size:12px;font-weight:600}
.mcreate:hover{opacity:.85}
.mcreate:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:620px){
  #sb{position:absolute;inset:0;width:100%;z-index:10;transition:transform .22s cubic-bezier(.4,0,.2,1);border-right:none}
  #main{position:absolute;inset:0;width:100%;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
  #app.co #sb{transform:translateX(-100%)}
  #app.co #main{transform:translateX(0)}
  #back-btn{display:block}
  #stxt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="sb">
    <div id="sbh">
      <span id="sb-title">bkmk-chat</span>
      <span id="id-badge">--</span>
    </div>
    <div id="chat-list"></div>
    <div id="sbf">
      <button class="sbbtn pri" id="new-btn">+ new chat</button>
      <button class="sbbtn" id="cfg-btn">* token</button>
    </div>
  </div>
  <div id="main">
    <div id="chdr">
      <button id="back-btn">&lsaquo;</button>
      <span id="chat-name-disp"># main</span>
      <div id="hdr-right">
        <div id="sdot"></div>
        <span id="stxt">connecting...</span>
        <button class="ibtn" id="ref-btn">refresh</button>
      </div>
    </div>
    <div id="cfg">
      <div><label>GitHub token (public_repo scope)</label><input type="password" id="tok-in" placeholder="ghp_..." autocomplete="off" spellcheck="false"></div>
      <p id="cfg-hint">Generate at <a href="https://github.com/settings/tokens/new?scopes=public_repo&description=BookmarkletChat" target="_blank">github.com/settings/tokens</a>. Stored in this browser.</p>
      <button id="cfg-save">Save token</button>
    </div>
    <div id="ntb"><span>No token - read only.</span><button id="ntb-btn">Set token</button></div>
    <div id="msgs"><div id="empty"><span class="big">( )</span><span>No messages yet</span></div></div>
    <div id="istrip"></div>
    <div id="input-area">
      <textarea id="msgin" placeholder="Type a message..." rows="1" maxlength="2000"></textarea>
      <button id="imgbtn" title="Attach image">img</button>
      <input type="file" id="imgin" accept="image/*" multiple>
      <button id="sendbtn">send</button>
    </div>
  </div>
</div>
<div id="mo">
  <div id="modal">
    <div class="mtitle">New chat</div>
    <div class="mtoggle">
      <button class="tybtn on" id="ty-priv" onclick="setTy('private')">[lock] Private</button>
      <button class="tybtn" id="ty-grp" onclick="setTy('group')">[grp] Group</button>
    </div>
    <div class="mf"><label class="mlabel">Chat name</label><input class="min" id="m-name" placeholder="e.g. Secret plans..." maxlength="40"></div>
    <div class="mf">
      <label class="mlabel" id="m-mlabel">Other person's ID</label>
      <div class="mrow2"><input class="min" id="m-mid" placeholder="XX0!" maxlength="4"><button id="add-mbr" onclick="addMbr()">add</button></div>
      <div id="chips"></div>
    </div>
    <p class="mhint" id="m-hint">IDs are 4 chars: 2 letters, 1 digit, 1 symbol (e.g. AB3!). Private = 1-to-1, either can delete. Group = creator can delete.</p>
    <div class="mactions"><button class="mcancel" onclick="closeMo()">cancel</button><button class="mcreate" id="m-create" onclick="submitChat()">create</button></div>
  </div>
</div>
<div id="lb"><button id="lb-x">x</button><img id="lb-img" src="" alt=""></div>
<div id="toast"></div>
<script>
var OWNER='ToasterGG',REPO='Bookmarklet-Chat',BR='main';
var MF='messages.txt',CD='chats',IF='chats/index.json',IMGD='images';
var RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BR;
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents';
var POLL=10000;
var SK='bkmk_chat_id',ST='bkmk_chat_token';
var LET='ABCDEFGHIJKLMNOPQRSTUVWXYZ',DIG='0123456789',SYM=['!','$','*','@','~'];

var myID=null,ghTok=null,curChat='main',idx={chats:[]},idxSHA=null;
var cSHAs={},cCont={},pollT=null,sending=false,pImgs=[],mTy='private',mMbrs=[];

function rr(n){return Math.floor(Math.random()*n)}

// Storage - localStorage works in blob URL iframes (inherits parent page origin)
function store(k,v){try{localStorage.setItem(k,v)}catch(e){try{sessionStorage.setItem(k,v)}catch(e2){}}}
function get(k){
  try{var v=localStorage.getItem(k);if(v!==null)return v}catch(e){}
  try{var v2=sessionStorage.getItem(k);if(v2!==null)return v2}catch(e){}
  return null;
}

function genID(){return LET[rr(26)]+LET[rr(26)]+DIG[rr(10)]+SYM[rr(SYM.length)]}
function getID(){var id=get(SK);if(!id){id=genID();store(SK,id)}return id}
function validID(id){return id&&id.length===4&&/^[A-Z]{2}[0-9]/.test(id)}
function genCID(ty){var c='abcdefghijklmnopqrstuvwxyz0123456789',id=(ty==='private'?'p':'g')+'_';for(var i=0;i<8;i++)id+=c[rr(c.length)];return id}

function saveTok(t){store(ST,t)}
function tokUI(){var h=!!ghTok;document.getElementById('ntb').classList.toggle('on',!h);document.getElementById('sendbtn').disabled=!h}

function chatURL(id){return id==='main'?API+'/'+MF:API+'/'+CD+'/'+id+'.txt'}
function ghH(){var h={'Accept':'application/vnd.github+json'};if(ghTok)h['Authorization']='Bearer '+ghTok;return h}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(b){return atob(b.replace(/
/g,''))}

function setS(cls,txt){document.getElementById('sdot').className=cls;document.getElementById('stxt').textContent=txt}
var tT;
function toast(m,ty){var el=document.getElementById('toast');el.textContent=m;el.className='show'+(ty?' '+ty:'');clearTimeout(tT);tT=setTimeout(function(){el.className=''},2800)}

async function ghPUT(url,body){
  var r=await fetch(url,{method:'PUT',headers:Object.assign(ghH(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error(e.message||'HTTP '+r.status)}
  return r.json();
}
async function ghDEL(url,body){
  var r=await fetch(url,{method:'DELETE',headers:Object.assign(ghH(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error(e.message||'HTTP '+r.status)}
}

async function fetchIdx(){
  try{
    var r=await fetch(API+'/'+IF+'?t='+Date.now(),{headers:ghH()});
    if(r.status===404){idx={chats:[]};idxSHA=null;return}
    if(!r.ok)return;
    var d=await r.json();idxSHA=d.sha;idx=JSON.parse(dec(d.content));
  }catch(e){console.warn('idx:',e)}
}
async function pushIdx(){
  var body={message:'update index',content:enc(JSON.stringify(idx,null,2)),branch:BR};
  if(idxSHA)body.sha=idxSHA;
  var d=await ghPUT(API+'/'+IF,body);idxSHA=d.content.sha;
}
function myChats(){return idx.chats.filter(function(c){return c.members.includes(myID)})}

async function fetchMsgs(id,silent){
  if(!silent)setS('','loading...');
  try{
    var r=await fetch(chatURL(id)+'?ref='+BR+'&t='+Date.now(),{headers:ghH()});
    if(r.status===404){cSHAs[id]=null;cCont[id]='';if(id===curChat)renderMsgs('');setS('live','live');return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json();cSHAs[id]=d.sha;
    var c=dec(d.content);
    if(c!==cCont[id]){cCont[id]=c;if(id===curChat)renderMsgs(c)}
    var t=new Date();setS('live','live '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
  }catch(e){setS('err','error');if(!silent)toast('Load failed: '+e.message,'err')}
}

async function poll(){
  await fetchIdx();
  if(curChat!=='main'){
    var still=myChats().some(function(c){return c.id===curChat});
    if(!still){toast('That chat was deleted','err');selectChat('main');return}
  }
  renderSB();
  await fetchMsgs(curChat,true);
}
function startPoll(){clearInterval(pollT);pollT=setInterval(poll,POLL)}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderSB(){
  var mine=myChats();
  var privs=mine.filter(function(c){return c.type==='private'});
  var grps=mine.filter(function(c){return c.type==='group'});
  function item(c,icon){
    var canDel=c.type==='private'?c.members.includes(myID):c.creator===myID;
    var delHTML=canDel
      ?'<button class="ci-del" onclick="event.stopPropagation();startDel(''+c.id+'')" title="Delete">x</button>'
       +'<span class="ci-confirm">'
       +'<button class="ci-yes" onclick="event.stopPropagation();doDel(''+c.id+'')">delete</button>'
       +'<button class="ci-no" onclick="event.stopPropagation();cancelDel(''+c.id+'')">cancel</button>'
       +'</span>'
      :'';
    return '<div class="ci'+(curChat===c.id?' active':'')+'" id="ci-'+c.id+'">'
      +'<span class="ci-icon" onclick="selectChat(''+c.id+'')">'+icon+'</span>'
      +'<span class="ci-name" onclick="selectChat(''+c.id+'')">'+esc(c.name)+'</span>'
      +delHTML+'</div>';
  }
  var h='<div class="ci'+(curChat==='main'?' active':'')+'" onclick="selectChat('main')">'
    +'<span class="ci-icon">#</span><span class="ci-name">main</span></div>';
  if(privs.length){h+='<div class="cl-label">Private</div>';privs.forEach(function(c){h+=item(c,'[p]')})}
  if(grps.length){h+='<div class="cl-label">Groups</div>';grps.forEach(function(c){h+=item(c,'[g]')})}
  document.getElementById('chat-list').innerHTML=h;
}

function startDel(id){var el=document.getElementById('ci-'+id);if(el)el.classList.add('del-confirm')}
function cancelDel(id){var el=document.getElementById('ci-'+id);if(el)el.classList.remove('del-confirm')}
async function doDel(id){
  try{
    await fetchIdx();
    idx.chats=idx.chats.filter(function(c){return c.id!==id});
    await pushIdx();
    var fr=await fetch(chatURL(id)+'?ref='+BR+'&t='+Date.now(),{headers:ghH()});
    if(fr.ok){var d=await fr.json();await ghDEL(chatURL(id),{message:'delete: '+id,sha:d.sha,branch:BR})}
    delete cSHAs[id];delete cCont[id];
    if(curChat===id)selectChat('main');
    renderSB();toast('Chat deleted','ok');
  }catch(e){toast('Delete failed: '+e.message,'err')}
}

function selectChat(id){
  curChat=id;
  var label='# main';
  if(id!=='main'){var c=idx.chats.find(function(x){return x.id===id});if(c)label=(c.type==='private'?'[p] ':'[g] ')+c.name}
  document.getElementById('chat-name-disp').textContent=label;
  renderSB();
  document.getElementById('app').classList.add('co');
  if(cCont[id]!==undefined)renderMsgs(cCont[id]);
  else{document.getElementById('empty').style.display='flex';fetchMsgs(id,false)}
  document.getElementById('msgin').value='';autoR();scrollBot(false);
}

var IMGRE=/^\[img:([^\]]+)\]$/;
function parseTs(l){var m=l.match(/^\[(\d\d:\d\d)\] /);return m?{t:m[1],r:l.slice(m[0].length)}:{t:null,r:l}}
function renderMsgs(content){
  var atBot=isBot();
  var lines=content?content.split('\n').filter(function(l){return l.trim()}):[]; 
  var msgs=document.getElementById('msgs'),emp=document.getElementById('empty');
  emp.style.display=lines.length?'none':'flex';
  msgs.querySelectorAll('.msg,.msys').forEach(function(el){el.remove()});
  if(!lines.length)return;
  var frag=document.createDocumentFragment();
  lines.forEach(function(line){
    var ts=parseTs(line),ci=ts.r.indexOf(': ');
    if(ci===-1){var el=document.createElement('div');el.className='msys';el.textContent=ts.r;frag.appendChild(el);return}
    var id=ts.r.slice(0,ci),msg=ts.r.slice(ci+2),own=id===myID,imgM=msg.match(IMGRE);
    var el=document.createElement('div');el.className='msg'+(own?' own':'');
    var row=document.createElement('div');row.className='mrow';
    var ids=document.createElement('span');ids.className='mid';ids.textContent=id+':';row.appendChild(ids);
    if(imgM){
      var fn=imgM[1],url=RAW+'/'+IMGD+'/'+fn;
      var wrap=document.createElement('span');wrap.className='mbody';
      var lnk=document.createElement('a');lnk.className='mimg-lnk';lnk.textContent=fn;lnk.href='#';
      lnk.addEventListener('click',function(e){e.preventDefault();var p=wrap.querySelector('.mimg-prev');if(p)p.classList.toggle('h')});
      wrap.appendChild(document.createTextNode(' '));wrap.appendChild(lnk);
      var prev=document.createElement('img');prev.className='mimg-prev h';prev.src=url;prev.alt=fn;
      prev.addEventListener('click',function(){openLB(url)});
      prev.addEventListener('error',function(){prev.style.display='none'});
      wrap.appendChild(prev);row.appendChild(wrap);
    }else{
      var bs=document.createElement('span');bs.className='mbody';bs.textContent=' '+msg;row.appendChild(bs);
    }
    if(ts.t){var tsp=document.createElement('span');tsp.className='mtime';tsp.textContent=ts.t;row.appendChild(tsp)}
    el.appendChild(row);frag.appendChild(el);
  });
  msgs.appendChild(frag);if(atBot)scrollBot(false);
}

async function sendMsg(){
  if(sending||!ghTok)return;
  var text=document.getElementById('msgin').value.trim();
  if(!text&&!pImgs.length)return;
  var btn=document.getElementById('sendbtn');
  sending=true;btn.disabled=true;btn.textContent='...';
  try{
    var fns=[];
    for(var ii=0;ii<pImgs.length;ii++){btn.textContent='^ img';fns.push(await uploadImg(pImgs[ii]))}
    var r=await fetch(chatURL(curChat)+'?ref='+BR+'&t='+Date.now(),{headers:ghH()});
    var cur='',cSHA=null;
    if(r.ok){var dd=await r.json();cSHA=dd.sha;cur=dec(dd.content)}
    else if(r.status!==404)throw new Error('HTTP '+r.status);
    var now=new Date(),ts=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    var nl=[];
    if(text)nl.push('['+ts+'] '+myID+': '+text);
    fns.forEach(function(fn){nl.push('['+ts+'] '+myID+': [img:'+fn+']')});
    var nc=cur?cur+'\n'+nl.join('\n'):nl.join('\n');
    var body={message:'chat: '+myID,content:enc(nc),branch:BR};
    if(cSHA)body.sha=cSHA;
    var result=await ghPUT(chatURL(curChat),body);
    cSHAs[curChat]=result.content.sha;
    document.getElementById('msgin').value='';pImgs=[];renderStrip();autoR();
    cCont[curChat]=nc;renderMsgs(nc);scrollBot(true);
    var t2=new Date();setS('live','live '+String(t2.getHours()).padStart(2,'0')+':'+String(t2.getMinutes()).padStart(2,'0'));
  }catch(e){toast('Send failed: '+e.message,'err')}
  finally{sending=false;btn.disabled=false;btn.textContent='send'}
}

async function uploadImg(imgObj){
  var ts=Date.now(),safe=imgObj.file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),fn=ts+'_'+safe;
  await ghPUT(API+'/'+IMGD+'/'+fn,{message:'img: '+myID,content:imgObj.dataURL.split(',')[1],branch:BR});
  return fn;
}

async function createChat(ty,name,mbrs){
  if(!ghTok){toast('Set your token first','err');return}
  var id=genCID(ty),allM=Array.from(new Set([myID].concat(mbrs)));
  await fetchIdx();
  idx.chats.push({id:id,type:ty,name:name,members:allM,creator:myID,createdAt:new Date().toISOString()});
  await pushIdx();
  var init='[system] '+name+' created';
  await ghPUT(API+'/'+CD+'/'+id+'.txt',{message:'create: '+name,content:enc(init),branch:BR});
  cCont[id]=init;renderSB();selectChat(id);toast('"'+name+'" created','ok');
}

function openMo(){
  mTy='private';mMbrs=[];
  document.getElementById('m-name').value='';document.getElementById('m-mid').value='';
  document.getElementById('chips').innerHTML='';setTy('private');
  document.getElementById('mo').classList.add('open');
  setTimeout(function(){document.getElementById('m-name').focus()},80);
}
function closeMo(){document.getElementById('mo').classList.remove('open')}
function setTy(t){
  mTy=t;
  document.getElementById('ty-priv').classList.toggle('on',t==='private');
  document.getElementById('ty-grp').classList.toggle('on',t==='group');
  document.getElementById('m-mlabel').textContent=t==='private'?"Other person's ID":"Add members by ID";
  if(t==='private'&&mMbrs.length>1){mMbrs=[mMbrs[0]];renderChips()}
}
function addMbr(){
  var input=document.getElementById('m-mid'),val=input.value.trim().toUpperCase();
  if(!validID(val)){toast('Invalid ID format','err');return}
  if(val===myID){toast("That's your own ID",'err');return}
  if(mMbrs.indexOf(val)>-1){toast('Already added','err');return}
  if(mTy==='private'&&mMbrs.length>=1){toast('Private chats are 1-to-1','err');return}
  mMbrs.push(val);input.value='';renderChips();
}
function rmMbr(id){mMbrs=mMbrs.filter(function(m){return m!==id});renderChips()}
function renderChips(){
  document.getElementById('chips').innerHTML=mMbrs.map(function(m){
    return '<span class="chip">'+esc(m)+'<button class="chiprm" onclick="rmMbr(''+m+'')">x</button></span>';
  }).join('');
}
async function submitChat(){
  var name=document.getElementById('m-name').value.trim();
  if(!name){toast('Give the chat a name','err');return}
  if(!mMbrs.length){toast('Add at least one member','err');return}
  var btn=document.getElementById('m-create');btn.disabled=true;btn.textContent='creating...';
  try{await createChat(mTy,name,mMbrs);closeMo()}
  catch(e){toast('Failed: '+e.message,'err')}
  finally{btn.disabled=false;btn.textContent='create'}
}

function isBot(){var m=document.getElementById('msgs');return m.scrollHeight-m.scrollTop-m.clientHeight<80}
function scrollBot(s){var m=document.getElementById('msgs');m.scrollTo({top:m.scrollHeight,behavior:s?'smooth':'instant'})}
function autoR(){var i=document.getElementById('msgin');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'}
function addPImgs(files){
  Array.from(files).forEach(function(f){
    if(!f.type.startsWith('image/'))return;
    var rd=new FileReader();
    rd.onload=function(e){pImgs.push({file:f,dataURL:e.target.result});renderStrip()};
    rd.readAsDataURL(f);
  });
}
function renderStrip(){
  var s=document.getElementById('istrip');s.innerHTML='';
  if(!pImgs.length){s.classList.remove('on');return}
  s.classList.add('on');
  pImgs.forEach(function(img,i){
    var w=document.createElement('div');w.className='ithw';
    var t=document.createElement('img');t.className='ith';t.src=img.dataURL;
    var rm=document.createElement('button');rm.className='ithrm';rm.textContent='x';
    rm.addEventListener('click',function(){pImgs.splice(i,1);renderStrip()});
    w.appendChild(t);w.appendChild(rm);s.appendChild(w);
  });
}
function openLB(src){document.getElementById('lb-img').src=src;document.getElementById('lb').classList.add('open')}
function closeLB(){document.getElementById('lb').classList.remove('open');document.getElementById('lb-img').src=''}

function init(){
  try{
    myID=getID();
    ghTok=get(ST)||null;
    document.getElementById('id-badge').textContent=myID;
    if(ghTok)document.getElementById('tok-in').value=ghTok;
    tokUI();
    fetchIdx().then(function(){renderSB();fetchMsgs('main',false)});
    startPoll();
  }catch(e){console.error('init error:',e)}
}

document.getElementById('sendbtn').addEventListener('click',sendMsg);
document.getElementById('msgin').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
document.getElementById('msgin').addEventListener('input',autoR);
document.getElementById('ref-btn').addEventListener('click',function(){fetchMsgs(curChat,false);startPoll()});
document.getElementById('cfg-btn').addEventListener('click',function(){document.getElementById('cfg').classList.toggle('open')});
document.getElementById('ntb-btn').addEventListener('click',function(){document.getElementById('cfg').classList.add('open')});
document.getElementById('cfg-save').addEventListener('click',function(){
  var t=document.getElementById('tok-in').value.trim();
  if(!t){toast('Enter a token first','err');return}
  ghTok=t;saveTok(t);document.getElementById('cfg').classList.remove('open');tokUI();toast('Token saved','ok');fetchMsgs(curChat,false);
});
document.getElementById('tok-in').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('cfg-save').click()});
document.getElementById('new-btn').addEventListener('click',openMo);
document.getElementById('mo').addEventListener('click',function(e){if(e.target===document.getElementById('mo'))closeMo()});
document.getElementById('m-mid').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addMbr()}});
document.getElementById('m-name').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('m-mid').focus()}});
document.getElementById('back-btn').addEventListener('click',function(){document.getElementById('app').classList.remove('co')});
document.getElementById('imgbtn').addEventListener('click',function(){document.getElementById('imgin').click()});
document.getElementById('imgin').addEventListener('change',function(){if(this.files.length)addPImgs(this.files);this.value=''});
document.addEventListener('paste',function(e){
  var files=Array.from(e.clipboardData.files).filter(function(f){return f.type.startsWith('image/')});
  if(files.length)addPImgs(files);
});
document.getElementById('lb').addEventListener('click',function(e){if(e.target===document.getElementById('lb'))closeLB()});
document.getElementById('lb-x').addEventListener('click',closeLB);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLB();closeMo()}});

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
